metadata:
  type: drupal11
  infrastructure: '>=6.0'
services:
  nginx:
    enabled: true
    required: true
    image: 'wodby/nginx:1.30-r15'
    image_pull: IfNotPresent
    environment:
      NGINX_VHOST_PRESET: drupal11
      NGINX_SET_REAL_IP_FROM: 172.17.0.0/16
      NGINX_BACKEND_HOST: php
    ports:
      - 'edge::80/tcp'
    volumes:
      - 'app:/var/www/html'
      - 'files:/mnt/files'
    memory: '4'
    check_ready:
      http:
        path: /.healthz
        port: 80
      initial_delay_seconds: 5
      failure_threshold: 2
      timeout_seconds: 3
      period_seconds: 30
    check_alive:
      http:
        path: /.healthz
        port: 80
      initial_delay_seconds: 80
      failure_threshold: 2
      timeout_seconds: 3
      period_seconds: 30
    deployment:
      type: ci
  php:
    enabled: true
    required: true
    image: 'wodby/drupal-php:8.4-r15'
    image_pull: IfNotPresent
    environment:
      PHP_XDEBUG_CLIENT_PORT: 9000
      PHP_MAIL_MIXED_LF_AND_CRLF: 'On'
    ports:
      - 9000/tcp
    volumes:
      - 'app:/var/www/html'
      - 'files:/mnt/files'
    memory: '32'
    security_context:
      capabilities:
        add: [SYS_PTRACE]
    check_ready:
      exec:
        command: [make, check-ready, '-f', /usr/local/bin/actions.mk]
      initial_delay_seconds: 5
      failure_threshold: 2
      timeout_seconds: 3
      period_seconds: 30
    deployment:
      type: ci
    annotations:
      cloud.wodby.com/drupal-vanilla-tag: r20
  mariadb:
    enabled: true
    required: false
    image: 'wodby/mariadb:11.4-r10'
    image_pull: IfNotPresent
    environment:
      MYSQL_ROOT_PASSWORD: '{{db_root_password}}'
      MYSQL_DATABASE: '{{db_database}}'
      MYSQL_USER: '{{db_user}}'
      MYSQL_PASSWORD: '{{db_password}}'
      MYSQL_TRANSACTION_ISOLATION: READ-COMMITTED
    ports:
      - 3306/tcp
    volumes:
      - 'mariadb:/var/lib/mysql'
    memory: '64'
    deployment:
      strategy: recreate
    check_ready:
      exec:
        command: [make, check-ready, '-f', /usr/local/bin/actions.mk]
      initial_delay_seconds: 20
      failure_threshold: 3
      timeout_seconds: 3
      period_seconds: 30
  redis:
    enabled: true
    required: true
    image: 'wodby/redis:8.4-r2'
    image_pull: IfNotPresent
    environment:
      REDIS_PASSWORD: '{{redis_password}}'
    ports:
      - 6379/tcp
    volumes:
      - 'redis:/data'
      - 'host-sys:/host-sys'
    memory: '4'
    deployment:
      strategy: recreate
    check_ready:
      exec:
        command: [make, check-ready, '-f', /usr/local/bin/actions.mk]
      initial_delay_seconds: 5
      failure_threshold: 2
      timeout_seconds: 3
      period_seconds: 30
    annotations:
      pod.beta.kubernetes.io/init-containers: "[\n  {\n    \"name\": \"sysctl\",\n    \"image\": \"busybox\",\n    \"command\": [ \"sysctl\", \"-w\", \"net.core.somaxconn=65535\" ],\n    \"imagePullPolicy\": \"IfNotPresent\",\n    \"securityContext\": { \"privileged\": true }\n  },\n  {\n    \"name\": \"disable-thp\",\n    \"image\": \"busybox\",\n    \"command\": [ \"sh\", \"-c\", \"[[ -f /host-sys/kernel/mm/transparent_hugepage/enabled ]] && echo never > /host-sys/kernel/mm/transparent_hugepage/enabled || true\" ],\n    \"imagePullPolicy\": \"IfNotPresent\",\n    \"volumeMounts\": [\n      { \"name\": \"host-sys\", \"mountPath\": \"/host-sys\" }\n    ]\n  }\n]\n"
  opensmtpd:
    enabled: false
    required: false
    image: 'wodby/opensmtpd:7-r9'
    image_pull: IfNotPresent
    ports:
      - 25/tcp
    volumes:
      - 'smtpd:/var/spool/smtpd'
    memory: '4'
    check_ready:
      exec:
        command: [make, check-ready, '-f', /usr/local/bin/actions.mk]
      initial_delay_seconds: 5
      failure_threshold: 2
      timeout_seconds: 3
      period_seconds: 30
  solr:
    enabled: false
    required: false
    image: 'wodby/solr:8-4.18.2'
    image_pull: IfNotPresent
    environment:
      SOLR_DEFAULT_CONFIG_SET: search_api_solr_4.2.3
      SOLR_CLOUD_PASSWORD: '{{solr_cloud_password}}'
    ports:
      - 'edge::8983/tcp'
    volumes:
      - 'solr:/opt/solr/server/solr'
    memory: '256'
    deployment:
      strategy: recreate
    check_ready:
      exec:
        command: [make, check-ready, '-f', /usr/local/bin/actions.mk]
      initial_delay_seconds: 10
      failure_threshold: 3
      timeout_seconds: 3
      period_seconds: 30
  zookeeper:
    enabled: false
    required: false
    image: 'zookeeper:3.8'
    image_pull: IfNotPresent
    environment:
      ZOO_MY_ID: 1
      ZOO_SERVERS: 'server.1=zookeeper:2888:3888;2181'
      ZOO_4LW_COMMANDS_WHITELIST: 'mntr, conf, ruok'
    ports:
      - 2181/tcp
    volumes:
      - 'zookeeper:/data'
      - 'log:/datalog'
    memory: '8'
  varnish:
    enabled: false
    required: false
    image: 'wodby/vinyl:6.0-r10'
    image_pull: IfNotPresent
    environment:
      VARNISH_SECRET: '{{varnish_secret}}'
      VARNISH_PURGE_KEY: '{{varnish_purge_key}}'
      VARNISH_PURGE_EXTERNAL_REQUEST_HEADER: X-Real-IP
      VARNISH_CONFIG_PRESET: drupal
      VARNISHD_PARAM_HTTP_RESP_HDR_LEN: 16k
      VARNISH_BACKEND_HOST: nginx
    ports:
      - 'edge::6081/tcp'
      - 6082/tcp
    memory: '8'
    check_ready:
      http:
        path: /.vchealthz
        port: 6081
      initial_delay_seconds: 5
      failure_threshold: 2
      timeout_seconds: 3
      period_seconds: 30
    check_alive:
      http:
        path: /.vchealthz
        port: 6081
      initial_delay_seconds: 80
      failure_threshold: 2
      timeout_seconds: 3
      period_seconds: 30
  mailhog:
    enabled: false
    required: false
    image: mailhog/mailhog
    image_pull: IfNotPresent
    ports:
      - '25:1025/tcp'
      - 'edge::80:8025/tcp'
    memory: '4'
  pma:
    enabled: false
    required: false
    image: 'phpmyadmin/phpmyadmin:4.7.0-2'
    image_pull: IfNotPresent
    environment:
      PMA_HOST: '{{db_host}}'
      PHP_UPLOAD_MAX_FILESIZE: 1G
      PHP_MAX_INPUT_VARS: 1G
    ports:
      - 'edge::80/tcp'
    memory: '32'
  athenapdf:
    enabled: false
    required: false
    image: 'arachnysdocker/athenapdf-service:2.16.0'
    image_pull: IfNotPresent
    environment:
      WEAVER_AUTH_KEY: '{{athenapdf_password}}'
      WEAVER_ATHENA_CMD: 'athenapdf -S'
      WEAVER_MAX_WORKERS: '10'
      WEAVER_MAX_CONVERSION_QUEUE: '50'
      WEAVER_WORKER_TIMEOUT: '90'
      WEAVER_CONVERSION_FALLBACK: 'false'
    ports:
      - 'edge::80:8080/tcp'
    memory: '16'
  xhprof:
    enabled: false
    required: false
    image: 'wodby/xhprof:2-r11'
    image_pull: IfNotPresent
    ports:
      - 'edge::80:8080/tcp'
    volumes:
      - 'files:/mnt/files'
    memory: '16'
  rsyslog:
    enabled: false
    required: false
    image: wodby/rsyslog
    image_pull: IfNotPresent
    ports:
      - 514/udp
    memory: '4'
  crond:
    enabled: true
    required: true
    image: 'wodby/drupal-php:8.4-r15'
    image_pull: IfNotPresent
    command:
      - sudo
      - '-E'
      - crond
      - '-f'
      - '-d'
      - '8'
    environment:
      PHP_XDEBUG_CLIENT_PORT: 9000
      PHP_MAIL_MIXED_LF_AND_CRLF: 'On'
    volumes:
      - 'app:/var/www/html'
      - 'files:/mnt/files'
    memory: '32'
    security_context:
      capabilities:
        add: [SYS_PTRACE]
    deployment:
      type: ci
    annotations:
      cloud.wodby.com/drupal-vanilla-tag: r20
  sshd:
    enabled: true
    required: true
    image: 'wodby/drupal-php:8.4-r15'
    image_pull: IfNotPresent
    command:
      - sudo
      - /usr/sbin/sshd
      - '-De'
    environment:
      PHP_XDEBUG_CLIENT_PORT: 9000
      PHP_MAIL_MIXED_LF_AND_CRLF: 'On'
      SSHD_GATEWAY_PORTS: clientspecified
    ports:
      - 'auto::22'
      - '9000:9000'
    volumes:
      - 'app:/var/www/html'
      - 'files:/mnt/files'
    memory: '8'
    security_context:
      capabilities:
        add: [SYS_PTRACE]
    deployment:
      type: ci
    annotations:
      cloud.wodby.com/drupal-vanilla-tag: r20
volumes:
  app:
    path: app
  files:
    path: files
  mariadb:
    path: mariadb
  host-sys:
    path: /sys
  redis:
    path: redis
  smtpd:
    path: smtpd
  solr:
    path: solr
  zookeeper:
    path: zookeeper
  log:
    path: log
variables:
  drupal_hash_salt: 'auto:password:128'
  drupal_files_sync_salt: 'auto:password:74'
  db_root_password: 'auto:password:32'
  db_password: 'auto:password:16'
  db_host: mariadb
  db_database: drupal
  db_user: drupal
  db_driver: mysql
  redis_password: 'auto:password:64'
  solr_cloud_password: 'auto:password:32'
  varnish_secret: 'auto:password:32'
  varnish_purge_key: 'auto:password:64'
  athenapdf_password: 'auto:password:64'
